
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Dulce Colección ♡</title>

  <!-- Librerías de realidad aumentada -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #79546b;
    }

    .panel {
      position: fixed;
      z-index: 10;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 420px;
      background: rgba(255, 250, 248, 0.94);
      border: 2px solid #ffffff;
      border-radius: 28px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(116, 65, 91, 0.15);
    }

    /* Encabezado */
    #encabezado {
      top: 18px;
      pointer-events: none;
    }

    .subtitulo {
      font-size: 12px;
      letter-spacing: 3px;
      color: #c487a2;
    }

    h1 {
      font-size: 26px;
      margin: 10px 0;
      color: #76516b;
    }

    .descripcion {
      font-size: 14px;
      margin-bottom: 15px;
    }

    /* Colección */
    #coleccion {
      display: flex;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .postre {
      background: #fff0f5;
      border: 2px solid #f8dce7;
      border-radius: 30px;
      padding: 9px 12px;
      font-size: 13px;
      opacity: 0.65;
      transition: 0.3s;
    }

    .postre.guardado {
      background: #ffd5e5;
      border-color: #f2a0be;
      opacity: 1;
    }

    /* Guía de escaneo */
    #guia {
      position: fixed;
      z-index: 5;
      top: 51%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 65vw;
      height: 65vw;
      max-width: 300px;
      max-height: 300px;
      border: 3px dashed rgba(255,255,255,0.9);
      border-radius: 30px;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    #guia::after {
      content: "✧";
      position: absolute;
      top: -25px;
      right: -15px;
      color: white;
      font-size: 42px;
    }

    #guia.oculto {
      opacity: 0;
    }

    /* Panel inferior */
    #panel-inferior {
      bottom: 20px;
    }

    #estado {
      font-size: 13px;
      color: #b58a9f;
      margin-bottom: 10px;
    }

    #mensaje {
      font-size: 19px;
      font-weight: bold;
      line-height: 1.4;
      margin-bottom: 18px;
    }

    button {
      border: none;
      font-family: inherit;
      cursor: pointer;
    }

    #guardar {
      width: 100%;
      padding: 17px;
      border-radius: 24px;
      background: #f4a5c1;
      color: #673b53;
      font-size: 17px;
      font-weight: bold;
      transition: 0.2s;
    }

    #guardar:disabled {
      background: #f2dce5;
      color: #b69baa;
      cursor: default;
    }

    #reiniciar {
      margin-top: 15px;
      background: none;
      color: #b08097;
      text-decoration: underline;
      font-size: 13px;
    }

    @media (max-height: 650px) {
      #encabezado {
        top: 8px;
        padding: 10px;
      }

      h1 {
        font-size: 20px;
        margin: 5px;
      }

      .descripcion {
        margin-bottom: 6px;
      }

      #panel-inferior {
        bottom: 8px;
        padding: 12px;
      }

      #mensaje {
        margin-bottom: 10px;
        font-size: 16px;
      }

      #guardar {
        padding: 12px;
      }

      #guia {
        width: 45vw;
        height: 45vw;
      }
    }
  </style>
</head>

<body>

  <!-- Interfaz superior -->
  <div class="panel" id="encabezado">

    <div class="subtitulo">
      MINI PASTELERÍA MÁGICA
    </div>

    <h1>🍰 Dulce colección ♡</h1>

    <div class="descripcion">
      Busca los postrecitos y completa tu colección
    </div>

    <div id="coleccion">
      <div class="postre" id="coleccion0">🎂 Pastel</div>
      <div class="postre" id="coleccion1">🥐 Croissant</div>
      <div class="postre" id="coleccion2">🧁 Panqué</div>
    </div>

  </div>

  <!-- Marco para escanear -->
  <div id="guia"></div>

  <!-- Interfaz inferior -->
  <div class="panel" id="panel-inferior">

    <div id="estado">
      Preparando la cámara...
    </div>

    <div id="mensaje">
      Coloca una imagen de postre frente a la cámara ♡
    </div>

    <button id="guardar" disabled>
      Encuentra un postre primero
    </button>

    <button id="reiniciar">
      Reiniciar colección ↺
    </button>

  </div>

  <!-- Escena de realidad aumentada -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 3; uiScanning: no"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">

    <!-- Modelos 3D -->
    <a-assets timeout="30000">
      <a-asset-item
        id="modeloPastel"
        src="./pastel.glb">
      </a-asset-item>

      <a-asset-item
        id="modeloCroissant"
        src="./croissant.glb">
      </a-asset-item>

      <a-asset-item
        id="modeloPanque"
        src="./panque.glb">
      </a-asset-item>
    </a-assets>

    <!-- Cámara -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- TARGET 0: PASTEL -->
    <a-entity
      id="target0"
      mindar-image-target="targetIndex: 0">


      <a-gltf-model
        src="#modeloPastel"
        position="0 0 0.08"
        rotation="0 0 0"
        scale="0.5 0.5 0.5">
      </a-gltf-model>

      
    </a-entity>

    <!-- TARGET 1: CROISSANT -->
    <a-entity
      id="target1"
      mindar-image-target="targetIndex: 1">


      <a-gltf-model
        src="#modeloCroissant"
        position="0 0 0.08"
        rotation="0 0 0"
        scale="0.03 0.03 0.03">
      </a-gltf-model>


    </a-entity>

    <!-- TARGET 2: PANQUÉ -->
    <a-entity
      id="target2"
      mindar-image-target="targetIndex: 2">


      <a-gltf-model
        src="#modeloPanque"
        position="0 0 0.15"
        rotation="0 0 0"
        scale="0.65 0.65 0.65">
      </a-gltf-model>

    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const nombres = ["Pastel", "Croissant", "Panqué"];

      const coleccion = new Set();
      const visibles = new Set();

      let postreActual = null;
      let errorCarga = false;

      const escena = document.querySelector("a-scene");
      const mensaje = document.getElementById("mensaje");
      const estado = document.getElementById("estado");
      const guia = document.getElementById("guia");
      const guardar = document.getElementById("guardar");
      const reiniciar = document.getElementById("reiniciar");

      // Comprueba si el postre ya está guardado
      function actualizarColeccion() {

        for (let i = 0; i < 3; i++) {

          const elemento = document.getElementById("coleccion" + i);
          const anillo = document.getElementById("anillo" + i);

          if (coleccion.has(i)) {
            elemento.classList.add("guardado");
            anillo.setAttribute("color", "#FF85AE");
          } else {
            elemento.classList.remove("guardado");
            anillo.setAttribute("color", "#FFFFFF");
          }
        }
      }

      // Actualiza los mensajes de la interfaz
      function actualizarInterfaz() {

        if (coleccion.size === 3) {
          estado.textContent = "Colección completada ♡";
          mensaje.textContent = "¡Conseguiste todos los postrecitos! 🎉";
          guardar.disabled = true;
          guardar.textContent = "Colección completa 💗";
          guia.classList.add("oculto");
          return;
        }

        if (visibles.size === 0) {

          postreActual = null;
          guia.classList.remove("oculto");

          if (!errorCarga) {
            estado.textContent = "Buscando postrecitos...";
          }

          mensaje.textContent =
            "Coloca una imagen de postre frente a la cámara ♡";

          guardar.disabled = true;
          guardar.textContent = "Encuentra un postre primero";
          return;
        }

        // Utiliza uno de los targets visibles
        if (!visibles.has(postreActual)) {
          postreActual = Array.from(visibles)[visibles.size - 1];
        }

        guia.classList.add("oculto");

        const nombre = nombres[postreActual];

        estado.textContent = "✦ Imagen reconocida";

        if (coleccion.has(postreActual)) {

          mensaje.textContent =
            "¡Ya tienes " + nombre + " en tu colección! 💗";

          guardar.disabled = true;
          guardar.textContent = "Postrecito guardado ♡";

        } else {

          mensaje.textContent =
            "¡Encontraste " + nombre + "! ✨";

          guardar.disabled = false;
          guardar.textContent = "♡ Guardar postrecito";
        }
      }

      // Detecta las imágenes
      for (let i = 0; i < 3; i++) {

        const target = document.getElementById("target" + i);

        target.addEventListener("targetFound", function () {
          visibles.add(i);
          postreActual = i;
          actualizarInterfaz();
        });

        target.addEventListener("targetLost", function () {
          visibles.delete(i);
          actualizarInterfaz();
        });
      }

      // Guardar el postre encontrado
      guardar.addEventListener("click", function () {

        if (postreActual === null) return;
        if (coleccion.has(postreActual)) return;

        coleccion.add(postreActual);

        actualizarColeccion();
        actualizarInterfaz();
      });

      // Reiniciar toda la colección
      reiniciar.addEventListener("click", function () {

        coleccion.clear();

        actualizarColeccion();
        actualizarInterfaz();
      });

      // Avisos de inicio y errores
      escena.addEventListener("arReady", function () {
        estado.textContent = "Cámara lista ♡";
        actualizarInterfaz();
      });

      escena.addEventListener("arError", function () {
        estado.textContent = "Error al iniciar la realidad aumentada";
        mensaje.textContent =
          "Revisa los permisos de cámara y el archivo targets.mind";
      });

      // Comprueba si falla algún modelo
      document.querySelectorAll("a-gltf-model").forEach(function (modelo) {

        modelo.addEventListener("model-error", function () {
          errorCarga = true;
          estado.textContent = "No se pudo cargar un modelo 3D";
          console.error("Error en modelo:", modelo.getAttribute("src"));
        });

      });

      actualizarColeccion();
    });
  </script>

</body>
</html>
